# ═══════════════════════════════════════════════════════════════════════════
# NPM & MCP REGISTRY PUBLISH WORKFLOW
# ═══════════════════════════════════════════════════════════════════════════
#
# Automatically publishes to npm and MCP Registry when a version tag is pushed.
#
# To trigger:
#   1. Update version in package.json
#   2. Commit: git commit -am "Release v1.2.0"
#   3. Tag: git tag v1.2.0
#   4. Push: git push origin main --tags
#
# Requirements:
#   - NPM_TOKEN secret configured in repository settings
#   - MCP_PUBLISHER_PRIVATE_KEY secret in the mcp-registry-publish
#     environment (Ed25519 private half; the public half is the TXT record
#     at ansvar.eu). Delivery moved off Azure Key Vault 2026-07-24:
#     kv-ansvar-dev is default-deny with an operator-only IP allowlist
#     (GAP-009) and sunsets after the MDR-045 W8 soak. Rotation: re-set the
#     secret from an operator seat (pipe the raw hex key in, never echo it)
#     and prove it with a workflow_dispatch run (auth-proof job) BEFORE
#     discarding old key material. The environment's deployment branch/tag
#     policy restricts secret release to main and v* tag runs.
#   - Repository has id-token: write permission for provenance
#
# ═══════════════════════════════════════════════════════════════════════════

name: Publish to npm & MCP Registry

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v0.1.0, v1.0.0, etc.
  # Dispatch runs ONLY the auth-proof job (test + publish are gated on the
  # tag push event) — use it to prove the registry signing key works after
  # seeding or rotating the environment secret.
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # TEST JOB
  # ─────────────────────────────────────────────────────────────────────────
  # Run tests before publishing
  # ─────────────────────────────────────────────────────────────────────────

  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild better-sqlite3

      - name: Build
        run: npm run build

      - name: Build database from seeds
        run: npm run build:db

      - name: Run tests
        run: npm test

  # ─────────────────────────────────────────────────────────────────────────
  # PUBLISH JOB
  # ─────────────────────────────────────────────────────────────────────────
  # Publish to npm and MCP Registry with provenance
  # ─────────────────────────────────────────────────────────────────────────

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # The MCP registry signing key lives in this environment's
    # MCP_PUBLISHER_PRIVATE_KEY secret — see the header comment for the
    # rotation procedure.
    environment: mcp-registry-publish

    permissions:
      contents: write  # Required for GitHub Release SBOM attachment
      id-token: write  # Required for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Get version from tag
        id: version
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          VERSION=${GIT_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update server.json version
        env:
          PKG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$PKG_VERSION\"/g" server.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild better-sqlite3

      - name: Build
        run: npm run build

      # ─────────────────────────────────────────────────────────────────────
      # SBOM GENERATION (Blueprint §9)
      # ─────────────────────────────────────────────────────────────────────

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # ─────────────────────────────────────────────────────────────────────
      # NPM PUBLISH
      # ─────────────────────────────────────────────────────────────────────

      - name: Publish to npm
        id: npm-publish
        run: npm publish --access public --provenance 2>&1 || echo "NPM_PUBLISH_FAILED=true" >> $GITHUB_OUTPUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check npm publish result
        env:
          NPM_FAILED: ${{ steps.npm-publish.outputs.NPM_PUBLISH_FAILED }}
        run: |
          if [ "$NPM_FAILED" = "true" ]; then
            echo "::warning::npm publish failed (version may already exist). Continuing to MCP Registry..."
          fi

      # ─────────────────────────────────────────────────────────────────────
      # MCP REGISTRY PUBLISH
      # ─────────────────────────────────────────────────────────────────────

      - name: Install MCP Publisher
        run: |
          curl -L -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.4.0/mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Authenticate with MCP Registry
        env:
          # Sourced from the mcp-registry-publish environment secret (see
          # the header comment for the rotation procedure).
          PRIVATE_KEY: ${{ secrets.MCP_PUBLISHER_PRIVATE_KEY }}
        run: |
          # A missing/renamed environment secret resolves to an empty string
          # silently — fail closed with a clear pointer instead of letting
          # the login step produce a confusing registry error.
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::MCP_PUBLISHER_PRIVATE_KEY is empty. Check the mcp-registry-publish environment secret on this repo."
            exit 1
          fi
          mcp-publisher login dns -domain ansvar.eu -private-key "$PRIVATE_KEY"

      - name: Publish to MCP Registry
        run: mcp-publisher publish

      # ─────────────────────────────────────────────────────────────────────
      # SBOM RELEASE ATTACHMENT
      # ─────────────────────────────────────────────────────────────────────

      # ─────────────────────────────────────────────────────────────────────
      # DATABASE ARTIFACT
      # ─────────────────────────────────────────────────────────────────────
      # Build DB from seeds, compress, and upload to GitHub Release.
      # Downstream Docker builds use scripts/download-db.sh to fetch this
      # instead of re-running slow Riksdagen API ingestion.
      # ─────────────────────────────────────────────────────────────────────

      - name: Build database from seeds
        run: npm run build:db

      - name: Compress database
        run: gzip -k data/database.db

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.cdx.json
            data/database.db.gz
          append_body: true
          body: |
            ### Artifacts
            - `database.db.gz` — Pre-built SQLite database (download for Docker builds)
            - `sbom.cdx.json` — CycloneDX SBOM

      # ─────────────────────────────────────────────────────────────────────
      # DEPLOYMENT SUMMARY
      # ─────────────────────────────────────────────────────────────────────

      - name: Deployment Summary
        env:
          PKG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "## Publication Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$PKG_VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published To:" >> $GITHUB_STEP_SUMMARY
          echo "- npm: https://www.npmjs.com/package/@ansvar/swedish-law-mcp/v/$PKG_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- MCP Registry: https://registry.modelcontextprotocol.io" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # AUTH PROOF (workflow_dispatch only)
  # ─────────────────────────────────────────────────────────────────────────
  # Proves the environment secret authenticates against the live MCP
  # registry without publishing anything. Run after seeding or rotating
  # MCP_PUBLISHER_PRIVATE_KEY.
  # ─────────────────────────────────────────────────────────────────────────

  auth-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    permissions:
      contents: read
    steps:
      - name: Install MCP Publisher
        run: |
          curl -L -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.4.0/mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Authenticate with MCP Registry (proof only, no publish)
        env:
          PRIVATE_KEY: ${{ secrets.MCP_PUBLISHER_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::MCP_PUBLISHER_PRIVATE_KEY is empty. Check the mcp-registry-publish environment secret on this repo."
            exit 1
          fi
          mcp-publisher login dns -domain ansvar.eu -private-key "$PRIVATE_KEY"
          echo "Auth proof passed — registry login succeeded with the environment secret"
